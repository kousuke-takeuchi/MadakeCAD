[workspace]
members = [".", "crates/madake-core", "crates/madake-mcp", "crates/madake-agent"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[package]
name = "madake-cad"
version = "0.1.0"
description = "MadakeCAD - 産業用電気図面CAD"
authors = ["ktakeuchi"]
edition = "2021"

[lib]
name = "madake_cad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
madake-core = { path = "crates/madake-core" }
madake-mcp = { path = "crates/madake-mcp" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
