[package]
name = "madake-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Embedded MCP server exposing MadakeCAD command API to AI agents"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures = "0.3.34"
madake-agent = { path = "../madake-agent" }
madake-core = { path = "../madake-core" }
rmcp = { version = "3.1.4", features = ["server", "transport-streamable-http-server"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "net", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tower = { version = "0.5", features = ["util"] }
