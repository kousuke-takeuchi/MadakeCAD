[package]
name = "madake-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MadakeCAD document model, command engine, and verification core (UI-independent)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
schemars = { version = "1", features = ["uuid1"] }
# PDF出力: sheet_to_svgの出力をベクタのままPDF化(テキストはフォント埋め込み)
svg2pdf = "0.13"
# 部品DB (グローバル共有マスタ)。bundledでOS非依存にSQLiteを同梱
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "6"
