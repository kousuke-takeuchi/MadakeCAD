name: CI

on:
  push:
    branches: [master]
  pull_request:

# Superseded runs are cancelled so a push does not keep three OS matrices burning.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # madake-cad (Tauri shell) is excluded: it needs webkit system libs and has no tests of its own
      # (the `bundle` job below is what compiles it, on all three platforms)
      - name: cargo test
        working-directory: src-tauri
        run: cargo test -p madake-core -p madake-mcp -p madake-agent -p madake-cli

  rust-cross:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runs the full suite (the agent tests use a bash fake CLI)
          - os: macos-latest
            packages: -p madake-core -p madake-mcp -p madake-agent -p madake-cli
          # Windows runs the OS-independent crates (no bash for the agent fakes)
          - os: windows-latest
            packages: -p madake-core -p madake-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test ${{ matrix.packages }}

  frontend:
    name: Frontend tests & types (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # vitest covers path handling that really does differ per OS (`fileNameOf` splits on
      # `/` and `\`, the recent-files store, the DXF/KiCad path predicates), and npm's own
      # optional native deps differ per platform — so this one runs on all three.
      - run: npx vitest run
      - run: npx vue-tsc --noEmit

  freecad:
    name: FreeCAD add-on tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The add-on's pure modules (Link API client, panel model, live follow) run without FreeCAD.
      # They read and write the settings file through pathlib, so all three OSes are worth running.
      # `python` (not `python3`) is the interpreter actions/setup-python puts on PATH on Windows too
      - run: python -m unittest discover -s freecad-addon/tests -v

  spec:
    name: Spec docs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Detailed Specification is generated from tests; it must be committed up to date.
      # Deliberately ubuntu-only: gen_spec.py only reads test sources and compares the rendered
      # text, so the result cannot differ per OS — and running it on Windows would compare
      # against CRLF-checked-out files and fail for a reason that is not a spec problem.
      - run: python3 scripts/gen_spec.py --check

  bundle:
    name: Bundle build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies (webkit2gtk, appindicator, rsvg)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Compiles the Tauri shell (madake-cad) and packages the installers on every platform, so a
      # Windows/WiX or Linux/AppImage break surfaces here instead of inside release.yml during a
      # tagged release. No signing: no secrets are used and nothing is uploaded — release.yml owns
      # the artifacts (M6 spec §3 keeps signing/notarization as post-release work).
      # (No signing env vars are set at all — Tauri only signs when a key is provided.)
      - run: npx tauri build
