name: Release

# Publishing a GitHub release (Releases → "Draft a new release" → "Publish release", a
# pre-release works too) builds the installers on macOS, Windows and Linux and attaches them
# to that same release:
#
#   macOS   .dmg (Apple silicon and Intel)
#   Windows .msi and the NSIS setup .exe
#   Linux   .AppImage, .deb and .rpm
#
# The release tag decides the version: tag `v1.2.3` builds version 1.2.3 (stamped into
# src-tauri/tauri.conf.json on the runner only, so the repository never needs a version bump
# commit first). The tag must be `vX.Y.Z` with numbers only, because the Windows .msi format
# accepts nothing else; mark test builds with GitHub's "Set as a pre-release" instead of a
# `-beta` suffix.
#
# GitHub does not start workflows for unpublished drafts, so the installers appear only after
# "Publish release" (allow 20-30 minutes). To rebuild the installers of a release that already
# exists, run this workflow by hand with its tag (Actions → Release → Run workflow).
#
# In-app updates: when the repository secrets TAURI_SIGNING_PRIVATE_KEY (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD) are set, the build also produces signed update archives
# and attaches latest.json, which installed apps read from
# https://github.com/<owner>/<repo>/releases/latest/download/latest.json (pre-releases are not
# "latest", so they are never offered as updates). Without the secret the installers are still
# built, only without update files. The matching public key lives in
# src-tauri/tauri.conf.json (plugins.updater.pubkey).
#
# Bundles are not code-signed or notarized yet (M6 spec §3).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing published release to (re)build the installers for, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          version="${TAG#v}"
          if ! [[ "$TAG" == v* && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3 (numbers only: the Windows .msi accepts no other version). Use 'Set as a pre-release' for test builds."
            exit 1
          fi
          if [ -z "$RELEASE_ID" ]; then
            # Started by hand: find the published release for the tag
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "release_id=$RELEASE_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Building MadakeCAD $version for release $TAG (id $RELEASE_ID)"

  bundle:
    name: Installers (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          # 22.04 rather than the latest image: an older glibc lets the AppImage/.deb run on
          # more distributions
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            target: ""
          - name: Windows
            platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies (webkit2gtk, appindicator, rsvg)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev fonts-noto-cjk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - run: npm ci
      - name: Stamp the release version (and updater artifacts) into tauri.conf.json (runner copy only)
        id: stamp
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = process.env.VERSION;
            const signing = process.env.HAS_SIGNING_KEY === "true";
            if (signing && !conf.plugins?.updater?.pubkey) {
              console.error("::error::TAURI_SIGNING_PRIVATE_KEY is set but plugins.updater.pubkey in src-tauri/tauri.conf.json is empty: installed apps could not verify the update.");
              process.exit(1);
            }
            if (!signing) console.log("::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building installers without in-app update files.");
            conf.bundle.createUpdaterArtifacts = signing;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `updater=${signing}\n`);
          '
          grep -E '"version"|createUpdaterArtifacts' src-tauri/tauri.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          retryAttempts: 1
          includeUpdaterJson: ${{ steps.stamp.outputs.updater == 'true' }}
          # Windows updates through the NSIS setup.exe (it can update a per-user install
          # without asking for admin rights)
          updaterJsonPreferNsis: true
