name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not attach confidential drawings — a minimal `.mdkproj` that reproduces the problem is ideal.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, what happened, what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Command line log / console output
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Editor / canvas, Reports / PDF / SVG, Verification / simulation, AI assistant, Import / export (KiCad, DXF), MCP / REST / CLI, FreeCAD add-on, Parts database, Other]
